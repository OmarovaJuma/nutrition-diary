services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=supersecretkeyforlocaldocker
    # volumes:   # закомментируйте том, чтобы не перетирать код внутри контейнера
    #   - ./nutrition_backend:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend